<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="description" content="ClarityCare — medical advice explained simply, in your language." />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var isDark =
            saved === "dark" ||
            (!saved &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- iOS PWA install support (Android/desktop get this via the generated manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ClarityCare" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>HealthCare Assistant</title>
    <!-- Google Identity Services — renders the "Continue with Google" button
         and issues the ID token that POST /api/v1/auth/google verifies. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
